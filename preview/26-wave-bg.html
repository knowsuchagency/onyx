<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--bg); }
  .card { padding: 0; min-height: 100vh; position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .label-overlay {
    position: absolute; left: 18px; top: 14px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase;
    z-index: 2;
  }
  .label-bottom {
    position: absolute; right: 18px; bottom: 12px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase;
    z-index: 2;
  }
</style></head>
<body><div class="card">
  <canvas id="c"></canvas>
  <div class="label-overlay">Particle wave · background visualization</div>
  <div class="label-bottom">~600 dots / sine landscape / 0.45 alpha indigo</div>
</div>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  function resize() {
    c.width = c.offsetWidth * devicePixelRatio;
    c.height = c.offsetHeight * devicePixelRatio;
  }
  resize();
  let t = 0;
  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    const w = c.width, h = c.height;
    const cols = 50, rows = 14;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const x = (i / cols) * w + 10;
        const baseY = h * 0.5 + (j / rows) * h * 0.45;
        const wave = Math.sin((i / 6) + t + j * 0.4) * 14 * devicePixelRatio;
        const y = baseY + wave;
        const alpha = 0.15 + (j / rows) * 0.5;
        ctx.fillStyle = `rgba(123,127,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, 1.5 * devicePixelRatio, 0, Math.PI*2);
        ctx.fill();
      }
    }
    t += 0.02;
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', resize);
</script>
</body></html>
