<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 20px 24px; gap: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .line { height: 28px; background: var(--bg-1); border-radius: 3px; }
  .l1 { border: 1px solid #1F2230; }
  .l2 { border: 1px solid #2A2D3D; }
  .l3 { border: 1px solid #3B3F5A; }
  .l4 { border: 1px dashed #2A2D3D; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg-1); letter-spacing: 0.1em; text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="heading">Lines · 1px structural</div>
  <div class="row">
    <div class="sw"><div class="line l1"></div><div class="n">line</div><div class="v">#1F2230 · default</div></div>
    <div class="sw"><div class="line l2"></div><div class="n">line-1</div><div class="v">#2A2D3D · hover</div></div>
    <div class="sw"><div class="line l3"></div><div class="n">line-active</div><div class="v">#3B3F5A · selected</div></div>
    <div class="sw"><div class="line l4"></div><div class="n">line-dash</div><div class="v">connectors</div></div>
  </div>
</div></body></html>
