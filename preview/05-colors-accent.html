<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 20px 24px; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .sw { display:flex; flex-direction:column; gap: 8px; align-items:flex-start; }
  .sw .chip {
    width: 100%; height: 56px; border-radius: 4px;
    background: var(--bg-1);
  }
  .sw .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg-1); letter-spacing: 0.1em; text-transform: uppercase; }
  .sw .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="heading">Indigo — single accent</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#7B7FFF"></div><div class="n">accent</div><div class="v">#7B7FFF · default</div></div>
    <div class="sw"><div class="chip" style="background:#9498FF"></div><div class="n">accent-1</div><div class="v">#9498FF · hover</div></div>
    <div class="sw"><div class="chip" style="background:#5C61E6"></div><div class="n">accent-2</div><div class="v">#5C61E6 · press</div></div>
  </div>
</div></body></html>
