<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 24px; gap: 14px; justify-content: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .box {
    height: 72px; border-radius: 4px; background: var(--bg-1);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-1);
  }
  .b1 { border: 1px solid var(--line); }
  .b2 { border: 1px solid var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 1px rgba(123,127,255,0.18); color: var(--accent); }
  .b3 { border: 1px solid var(--line); box-shadow: 0 24px 64px -16px rgba(0,0,0,0.6); }
  .n { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-1); text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="heading">Elevation · borders &gt; shadows</div>
  <div class="row">
    <div class="item"><div class="box b1">Default</div><div class="n">border</div><div class="v">1px var(--line)</div></div>
    <div class="item"><div class="box b2">Active</div><div class="n">glow-accent</div><div class="v">inset + 1px outer</div></div>
    <div class="item"><div class="box b3">Overlay</div><div class="n">shadow-overlay</div><div class="v">drop · run inspector only</div></div>
  </div>
</div></body></html>
