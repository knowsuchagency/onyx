<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 20px 24px; gap: 14px; justify-content: center; }
  .label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
  .label-fg { color: var(--fg-1); }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .id { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .ts { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="row">
    <span class="label">AGENT ROSTER</span>
    <span class="label">RUN STATUS</span>
    <span class="label">QUEUE DEPTH</span>
    <span class="label label-fg">SYSTEM HEALTH</span>
  </div>
  <div class="row">
    <span class="id">EXE-2026-0311</span>
    <span class="ts">2026-05-26 14:32:18 UTC</span>
    <span class="id" style="color:var(--accent)">24.1K tokens</span>
    <span class="ts">$0.18 · 1.2s</span>
  </div>
  <div class="meta">JetBrains Mono · uppercase tracked 0.14em · 10–12 px</div>
</div></body></html>
