<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 32px; }
  .logo-row { display: flex; align-items: center; gap: 18px; }
  .mark { width: 28px; height: 28px; background: var(--accent); }
  .wm { font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: -0.02em; color: var(--fg); line-height: 1; }
  .meta { display: flex; gap: 32px; margin-top: auto; }
  .meta .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); }
  .meta .v { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); margin-top: 4px; }
</style></head>
<body><div class="card">
  <div class="logo-row">
    <div class="mark"></div>
    <div class="wm">ONYX</div>
    <div style="flex:1"></div>
    <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;color:var(--fg-2);text-transform:uppercase;">orchestration os v1.0</div>
  </div>
  <div class="meta">
    <div><div class="label">Wordmark</div><div class="v">Space Grotesk 700</div></div>
    <div><div class="label">Mark</div><div class="v">#7B7FFF / 28×28 square</div></div>
    <div><div class="label">Lockup</div><div class="v">Mark + wordmark · 18px gap</div></div>
  </div>
</div></body></html>
