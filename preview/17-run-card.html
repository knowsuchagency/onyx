<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 24px; justify-content: center; align-items: center; }
  .run {
    width: 320px;
    border: 1px solid var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 1px rgba(123,127,255,0.18);
    background: var(--bg-1);
    border-radius: 4px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
    font-family: var(--font-sans);
  }
  .top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
  .top .ts { color: var(--fg-2); }
  .title { font-size: 15px; font-weight: 600; color: var(--fg); }
  .grid { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; row-gap: 4px; font-size: 11px; }
  .k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-2); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
  .metrics { display: flex; gap: 16px; padding-top: 6px; border-top: 1px solid var(--line); }
  .m { display: flex; flex-direction: column; gap: 2px; }
  .m .lbl { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-2); }
  .m .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg); }
  .bar { height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 65%; }
</style></head>
<body><div class="card">
  <div class="run">
    <div class="top"><span>EXE-2026-0311</span><span class="ts">1m ago</span></div>
    <div class="title">Search funding data</div>
    <div class="grid">
      <div class="k">Agent</div><div class="v">Researcher</div>
      <div class="k">Model</div><div class="v">GPT-4o</div>
    </div>
    <div class="metrics">
      <div class="m"><span class="lbl">Tokens</span><span class="val">24.1K</span></div>
      <div class="m"><span class="lbl">Cost</span><span class="val">$0.18</span></div>
      <div class="m"><span class="lbl">Latency</span><span class="val">1.2s</span></div>
    </div>
    <div class="bar"><div></div></div>
  </div>
</div></body></html>
