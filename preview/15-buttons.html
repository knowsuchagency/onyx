<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 24px; gap: 14px; justify-content: center; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.14em;
    padding: 9px 18px; border-radius: 3px; cursor: pointer;
    transition: all 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .btn-primary { background: var(--accent); color: #08091A; border: 1px solid var(--accent); }
  .btn-primary:hover { background: var(--accent-1); border-color: var(--accent-1); }
  .btn-ghost { background: transparent; color: var(--fg-1); border: 1px solid var(--line-1); }
  .btn-ghost:hover { color: var(--fg); border-color: var(--line-active); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="heading">Buttons</div>
  <div class="row">
    <button class="btn btn-primary">Review &amp; approve</button>
    <button class="btn btn-ghost">View full log</button>
    <button class="btn btn-ghost">Cancel run</button>
    <button class="btn btn-danger">Abort</button>
  </div>
  <div class="v">primary · ghost · danger · 9 × 18px · letter-spacing 0.14em</div>
</div></body></html>
