<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 20px 24px; justify-content: center; gap: 14px; }
  .row { display: flex; gap: 28px; align-items: center; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 80px; height: 60px; background: var(--bg-1); border: 1px solid var(--line-1); }
  .n { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-1); text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="heading">Radii · almost flat</div>
  <div class="row" style="justify-content:space-around">
    <div class="item"><div class="box" style="border-radius:0"></div><div class="n">none</div><div class="v">0px</div></div>
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="n">radius-sm</div><div class="v">2px · chips</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="n">radius-md</div><div class="v">4px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="n">radius-lg</div><div class="v">6px · panels</div></div>
    <div class="item"><div class="box" style="border-radius:999px; width:120px; height:28px;"></div><div class="n">pill</div><div class="v">status pills</div></div>
  </div>
</div></body></html>
