<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 20px 24px; justify-content: center; gap: 10px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .bar { background: var(--accent); height: 8px; border-radius: 1px; }
  .n { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-1); text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="heading">Spacing · 4px base</div>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px"></div><div class="n">s-1</div><div class="v">4</div></div>
    <div class="item"><div class="bar" style="width:8px"></div><div class="n">s-2</div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="width:12px"></div><div class="n">s-3</div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="width:16px"></div><div class="n">s-4</div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="width:20px"></div><div class="n">s-5</div><div class="v">20</div></div>
    <div class="item"><div class="bar" style="width:24px"></div><div class="n">s-6</div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="width:32px"></div><div class="n">s-7</div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="width:40px"></div><div class="n">s-8</div><div class="v">40</div></div>
    <div class="item"><div class="bar" style="width:56px"></div><div class="n">s-9</div><div class="v">56</div></div>
    <div class="item"><div class="bar" style="width:72px"></div><div class="n">s-10</div><div class="v">72</div></div>
  </div>
</div></body></html>
