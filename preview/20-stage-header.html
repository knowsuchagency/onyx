<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 24px; gap: 12px; justify-content: center; }
  .heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
  .cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .col {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding: 8px 4px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .col .lbl { display: flex; align-items: center; gap: 6px; color: var(--fg); }
  .col .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 999px; }
  .col .right { display: flex; gap: 6px; align-items: center; color: var(--fg-2); }
  .col .plus { width: 14px; height: 14px; border: 1px solid var(--line-1); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="heading">Orchestration board · column headers</div>
  <div class="cols">
    <div class="col"><span class="lbl"><span class="dot"></span>Intake</span><span class="right">5 <span class="plus">+</span></span></div>
    <div class="col"><span class="lbl"><span class="dot"></span>Plan</span><span class="right">4 <span class="plus">+</span></span></div>
    <div class="col"><span class="lbl"><span class="dot"></span>Execute</span><span class="right">7 <span class="plus">+</span></span></div>
    <div class="col"><span class="lbl"><span class="dot"></span>Review</span><span class="right">3 <span class="plus">+</span></span></div>
    <div class="col"><span class="lbl"><span class="dot" style="background:#F2B144"></span>Blocked</span><span class="right">2 <span class="plus">+</span></span></div>
    <div class="col"><span class="lbl"><span class="dot" style="background:#4ADE9A"></span>Complete</span><span class="right">6 <span class="plus">+</span></span></div>
  </div>
</div></body></html>
