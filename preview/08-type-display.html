<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card { padding: 16px 28px; justify-content: center; gap: 14px; }
  .hero { font-family: var(--font-display); font-weight: 700; font-size: 84px; letter-spacing: -0.025em; line-height: 1; color: var(--fg); }
  .num  { font-family: var(--font-display); font-weight: 700; font-size: 84px; letter-spacing: -0.025em; line-height: 1; color: var(--fg); }
  .meta { display: flex; gap: 28px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div style="display:flex; gap: 36px; align-items: baseline; flex-wrap: wrap;">
    <div class="hero">AGENT OPS</div>
    <div class="num" style="color: var(--fg-2); font-size: 56px;">2.4M</div>
  </div>
  <div class="meta">
    <span>Space Grotesk · 700</span>
    <span>96 / 56 / 32 px</span>
    <span>Tracking −0.02em</span>
  </div>
</div></body></html>
